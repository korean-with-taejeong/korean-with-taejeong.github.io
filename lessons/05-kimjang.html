<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5과 · 김장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Korean with Taejeong · practice app template
   VOICE: calm, warm practice room; a teacher's marked-up script
   IDEA: a speaking score for Korean: pauses, melody, how it really sounds [ ], and new information
   COLOUR and TYPE: warm paper, orange for focus, blue for melody/pauses, teal for sound changes; Noto Sans KR for Korean, Atkinson Hyperlegible Next for Latin
   LAYOUT: one 680px column, sticky header with a 4-step bar, fixed bottom action */
:root{color-scheme:light;--z:1;--bg:#FAF7F2;--bg2:#F2ECE3;--card:#FFFFFF;--line:#E6DCCF;--ink:#2B2420;--hi:#1C1713;--mut:#6B5F56;--dim:#998C81;--y:#F28C28;--yi:#2B1700;--at:#B4560F;--lav:#4F7CAC;--teal:#1E7F72;--cta:#2B2420;--ctai:#FAF7F2;--now:rgba(242,140,40,.17);--hit:rgba(79,124,172,.2);--red:#D9473A}
:root[data-look=night]{color-scheme:dark;--bg:#1F1A16;--bg2:#2A231E;--card:#28211C;--line:#3D342C;--ink:#F1EAE0;--hi:#FFF8EF;--mut:#C0B3A6;--dim:#8F8277;--y:#F5A04A;--yi:#2B1700;--at:#F5A04A;--lav:#8DB0DB;--teal:#6FD0BF;--cta:#F1EAE0;--ctai:#1F1A16;--now:rgba(245,160,74,.18);--hit:rgba(141,176,219,.26);--red:#EF6B5E}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
html{word-break:keep-all;overflow-wrap:break-word}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Atkinson Hyperlegible Next","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
:lang(ko) body{font-family:"Noto Sans KR","Atkinson Hyperlegible Next",-apple-system,"Apple SD Gothic Neo",sans-serif}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,label:focus-within,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--y);outline-offset:3px}
svg{display:block}
.wrap{max-width:680px;margin:0 auto;padding:0 20px calc(124px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 84%,transparent);padding:calc(8px + env(safe-area-inset-top)) 20px 8px;max-width:680px;margin:0 auto}
.hrow{display:flex;align-items:center;gap:8px;min-height:60px}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.icon svg{width:23px;height:23px}
.ht{flex:1;overflow:hidden}
.ov,.tt,.sb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov{font-size:12.5px;font-weight:700;color:var(--at)}
.tt{font-size:19px;font-weight:700;color:var(--hi);line-height:1.25}
.sb{font-size:13px;color:var(--mut)}
.az{font-size:18px;font-weight:700;position:relative}.az i{position:absolute;right:4px;top:6px;font-style:normal;font-size:11px;color:var(--at)}
.lg{font-size:14px;font-weight:700;border:1.5px solid var(--line);width:44px;height:36px;border-radius:10px}
.bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.bar i{height:5px;border-radius:3px;background:var(--line)}
.bar i.d{background:var(--y)}.bar i.c{background:var(--ink)}
.blab{font-size:13px;margin-top:10px}
.kick{font-size:14px;font-weight:700;color:var(--mut);margin:22px 0 10px}
h1{font-size:clamp(28px,6.4vw,36px);line-height:1.18;margin:0 0 10px;color:var(--hi);font-weight:700;text-wrap:balance}
.lead{color:var(--mut);margin:0 0 18px;font-size:calc(16.5px*var(--z))}
.pills{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.pl{font-size:14px;color:var(--mut)}
.pill{min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;display:inline-flex;align-items:center;gap:8px;font-size:15px;background:transparent}
.pill svg{width:13px;height:13px}
.pill.sel{background:var(--cta);color:var(--ctai);border-color:var(--cta)}
.pill.sm{min-height:42px;padding:0 14px;font-size:14px}
.x{display:none!important}.on .x{display:inline-flex!important}.on .o{display:none!important}
.o,.x{align-items:center;gap:8px;display:inline-flex}
.pill.on{border-color:var(--y);color:var(--at)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:calc(13.5px*var(--z));color:var(--mut);margin:0 0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lgf{font-weight:700;color:var(--hi);text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:2px;text-underline-offset:4px}
.lgp{color:var(--teal);font-weight:700}
.note{font-size:calc(13.5px*var(--z));color:var(--dim);margin:0 0 6px}
.romrow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut);margin:6px 0 0}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--y)}.sw.on::after{left:23px}
.ann{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:calc(clamp(21px,5.2vw,25px)*var(--z));line-height:2.6;margin:16px 0 20px;word-break:keep-all}
.ann.rom,.rom .tx{line-height:3.3}
.sg{border-radius:6px;padding:3px 1px;transition:background .25s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ann .sg{cursor:pointer}
.sg.now{background:var(--now)}
.w{position:relative;display:inline-block;line-height:1.3}
.w.has{cursor:pointer}
.w.has .hg{text-decoration:underline dotted var(--teal);text-decoration-thickness:2px;text-underline-offset:.3em}
.pr{position:absolute;left:50%;bottom:calc(100% + .12em);transform:translateX(-50%);font-size:.5em;line-height:1;color:var(--teal);font-weight:700;white-space:nowrap;pointer-events:none}
.rm{display:none;position:absolute;left:50%;top:calc(100% + .18em);transform:translateX(-50%);font-family:"Atkinson Hyperlegible Next",sans-serif;font-size:.46em;line-height:1;color:var(--dim);white-space:nowrap;pointer-events:none}
.rom .rm{display:block}
.w.f .hg{font-weight:700;color:var(--hi);text-decoration:underline solid var(--y);text-decoration-thickness:.12em;text-underline-offset:.3em}
.w.hit{background:var(--hit);border-radius:5px;box-shadow:0 0 0 3px var(--hit)}
.w.play{background:var(--now);border-radius:5px}
.tn{color:var(--lav);font-weight:600;margin:0 .1em 0 .15em;white-space:nowrap}
.nb{white-space:nowrap} /* last word + arrow + pause stay on one line */
.p1,.p2{display:inline-block;height:1em;vertical-align:-.15em;margin:0 .2em 0 .25em}
.p1{width:2px;background:var(--lav);opacity:.5}
.p2{width:9px;border-left:2.5px solid var(--lav);border-right:2.5px solid var(--lav)}
.hm{background:var(--hit);box-shadow:0 0 0 5px var(--hit);border-radius:4px;opacity:1}
.tr{color:var(--mut);font-size:calc(16px*var(--z));line-height:1.7;margin:0 0 24px}
.card{border:1.5px solid var(--line);border-radius:22px;padding:18px 20px;margin:0 0 16px;background:var(--card)}
.mh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px}
.mh b{color:var(--at)}.mh span{color:var(--dim);font-size:13px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.cnt{font-weight:700;font-variant-numeric:tabular-nums}
.circ{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.circ svg{width:20px;height:20px}
.circ:disabled{opacity:.35;cursor:default}
.circ.sm{width:46px;height:46px}.circ.sm svg{width:15px;height:15px}
.circ.on{border-color:var(--y);color:var(--at)}
.mi{display:flex;gap:14px;align-items:flex-start;min-height:70px}
.mi p{margin:0;font-size:calc(16.5px*var(--z));line-height:1.65}
.mi b{color:var(--hi);margin-right:4px;font-family:"Noto Sans KR",sans-serif}
.tag{flex:none;font-weight:700;font-size:13px;padding:3px 9px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap;margin-top:2px}
.k0{color:var(--lav)}.k1{color:var(--lav)}.k2{color:var(--teal)}.k3{color:var(--at)}.k4{color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--mut);white-space:nowrap}
.chip.y{background:var(--y);color:var(--yi)}
.chip.t{color:var(--teal)}
.mini{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;color:var(--mut);min-height:42px;margin-top:6px}
.mini svg{width:11px;height:11px}
.why{background:var(--bg2);border-radius:22px;padding:18px 20px;margin:0 0 26px}
.why h3,.sec{font-size:15px;color:var(--at);margin:0 0 10px;font-weight:700}
.sec{margin:28px 0 12px;color:var(--mut)}
.why p{margin:0 0 10px;font-size:calc(16px*var(--z));line-height:1.6}.why p:last-child{margin:0}
.why b{color:var(--hi);font-weight:700;font-family:"Noto Sans KR",sans-serif}
.id{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 16px 18px;border:1.5px solid var(--line);border-radius:18px;margin-bottom:10px;background:var(--card)}
.ib{flex:1}
.ih{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.de{font-weight:700;color:var(--hi);font-size:calc(19px*var(--z));font-family:"Noto Sans KR",sans-serif}
.tg{font-size:11.5px;font-weight:700;color:var(--lav);border:1px solid var(--lav);border-radius:999px;padding:0 8px;line-height:19px}
.mean{margin-top:4px;font-size:calc(16px*var(--z))}
.nt{font-size:calc(14.5px*var(--z));color:var(--mut);margin-top:3px;line-height:1.55}
.tip{font-size:calc(14.5px*var(--z));color:var(--dim);margin:-4px 0 18px}
.ch{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px 14px 14px 20px;margin-bottom:12px;cursor:pointer;position:relative}
.ch .tx{flex:1;font-family:"Noto Sans KR",sans-serif;font-size:calc(clamp(20px,4.8vw,23px)*var(--z));line-height:2.5;word-break:keep-all}
.rb{width:56px;height:56px;border-radius:50%;background:var(--cta);color:var(--ctai);display:grid;place-items:center;flex:none}
.rb svg{width:22px;height:22px}
.ch.on{border-color:var(--y)}.ch.on .rb{background:var(--y);color:var(--yi)}
.yt{display:none;position:absolute;top:-11px;right:18px;background:var(--y);color:var(--yi);font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.ch.turn .yt{display:block}
.rec{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin:0 0 16px}
.rec .lab{font-size:14px;color:var(--mut);margin:0 0 10px}
.micwhy{display:flex;gap:8px;align-items:flex-start;font-size:calc(14px*var(--z));color:var(--mut);margin:0 0 12px}
.micwhy svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--at)}
.ybtn,.obtn{width:100%;min-height:62px;border-radius:16px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-decoration:none}
.ybtn{background:var(--y);color:var(--yi)}
.obtn{border:1.5px solid var(--line);font-size:16px;min-height:56px;background:var(--card)}
.ybtn svg,.obtn svg{width:22px;height:22px}
.ybtn.recing{background:var(--red);color:#fff}
.ybtn.recing::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.recmsg{font-size:calc(14.5px*var(--z));line-height:1.6;color:var(--red);margin:12px 2px 0}
.recmsg.info{color:var(--mut)}
.hint{font-size:calc(13.5px*var(--z));color:var(--dim);margin:12px 2px 0;line-height:1.55}
.lab2{font-size:14px;color:var(--mut);margin:0 0 8px;font-weight:700}
.mine{margin:0 0 18px}
.mine audio{width:100%;display:block}
.cmp{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.fname{font-size:12.5px;color:var(--dim);margin-top:8px;word-break:break-all}
.empty{font-size:calc(15px*var(--z));color:var(--mut);padding:10px 2px;margin:0}
.wa{margin-top:10px}
.ck{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1.5px solid var(--line);border-radius:18px;margin-bottom:10px;cursor:pointer;font-size:calc(16px*var(--z));line-height:1.55;background:var(--card)}
.ck input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:8px;background:var(--card);border:1.5px solid var(--line);flex:none;margin:0;display:grid;place-items:center;cursor:pointer}
.ck input:checked{background:var(--y);border-color:var(--y)}
.ck input:checked::after{content:"";width:7px;height:13px;border:solid var(--yi);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.ck.c{border-color:var(--y)}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
.cta>div{max-width:680px;margin:0 auto;display:flex;gap:14px}
.back{width:72px;height:60px;border:1.5px solid var(--line);border-radius:18px;display:grid;place-items:center;flex:none}
.back svg{width:22px;height:22px}
.go{flex:1;min-height:60px;border-radius:18px;background:var(--cta);color:var(--ctai);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.go svg{width:18px;height:18px}
.hero{padding:6px 0 4px}
.hero h1{font-family:"Noto Sans KR",sans-serif}
.h1b{display:block;color:var(--mut);font-size:.5em;font-weight:500;margin-top:4px;font-family:"Atkinson Hyperlegible Next",sans-serif}
.hello{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;margin:0 0 14px}
.hello button{font-size:13.5px;color:var(--mut);text-decoration:underline;min-height:36px}
.stat{display:flex;gap:16px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px 18px;margin:6px 0 4px}
.dd{font-size:15px;font-weight:700;color:var(--at);flex:0 1 52%;min-width:0;overflow-wrap:anywhere}
.sx{flex:1}.sx b{font-size:15px}
.sbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:8px}
.sbar i{height:6px;border-radius:3px;background:var(--line)}.sbar i.d{background:var(--y)}
.pc{display:flex;gap:16px;align-items:center;padding:16px 18px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;margin-bottom:12px;width:100%;text-align:left}
.pc.nx{border-color:var(--y)}
.lt{width:48px;height:48px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-weight:700;font-size:20px;color:var(--at);flex:none}
.lt svg{width:22px;height:22px}
.pc.done .lt{background:var(--y);color:var(--yi)}
.pb{flex:1}
.pt{display:block;font-weight:700;font-size:16.5px;color:var(--hi)}
.pd{display:block;font-size:15px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:"Noto Sans KR",sans-serif}
.meta{display:block;font-size:12.5px;color:var(--dim);margin-top:2px}
.foot{font-size:12.5px;color:var(--dim);margin:22px 0 0}
.foot a{color:var(--mut)}
.pn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--bg2);color:var(--at);font-size:13px;font-weight:700;margin-right:8px;vertical-align:.25em;font-family:"Atkinson Hyperlegible Next",sans-serif}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--y);color:var(--yi);font-weight:700;padding:12px 20px;border-radius:999px;z-index:9;white-space:nowrap;animation:tu .3s ease}
@keyframes tu{from{opacity:0;transform:translate(-50%,10px)}}
.load{font-size:13px;color:var(--dim);margin:-6px 0 14px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(28,23,19,.45);display:grid;place-items:center;padding:20px}
.mbox{background:var(--card);border-radius:24px;padding:26px 22px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox h2{margin:0 0 6px;font-size:24px;color:var(--hi)}
.mbox p{margin:0 0 16px;color:var(--mut);font-size:15px}
.mbox input{width:100%;min-height:56px;border-radius:14px;border:1.5px solid var(--line);padding:0 16px;font-size:18px;background:var(--bg);margin-bottom:12px}
@media (prefers-reduced-motion:reduce){.toast,.ybtn.recing::before{animation:none}.sg,.sw::after{transition:none}}
@media (max-width:420px){.wrap{padding-left:16px;padding-right:16px}header.top{padding-left:10px;padding-right:10px}.ch{padding-left:16px}.rb{width:50px;height:50px}.circ{width:50px;height:50px}.back{width:62px}}
</style>
</head>
<body>
<div id="app"></div>
<script>

d (future, purpose)","ko":"앞으로 할 일을 꾸미는 관형사형"},"note":{"en":"먹을 김치 = kimchi (that we will) eat; 할 일 = things to do; 살 집 = a house to live in.","ko":"먹을 김치, 할 일, 살 집."},"s":1},{"de":"N 동안","tag":{"en":"Grammar","ko":"문법"},"mean":{"en":"during, for (a period of time)","ko":"시간의 길이"},"note":{"en":"겨울 동안 = during the winter; 3일 동안 = for three days.","ko":"겨울 동안, 3일 동안."},"s":1},{"de":"한 번에","tag":{"en":"Expression","ko":"표현"},"mean":{"en":"at once, in one go","ko":"한 차례에 모두"},"note":{"en":"한 번에 많이 만들어요 = make a lot in one go. Opposite: 조금씩 (a little at a time).","ko":"반대: 조금씩."},"s":2},{"de":"김장 (김장하다)","tag":{"en":"Vocabulary","ko":"어휘"},"mean":{"en":"making a big batch of kimchi for the winter","ko":"겨울 동안 먹을 김치를 한꺼번에 담그는 일"},"note":{"en":"Usually in late autumn; families and neighbours often do it together. Kimjang is on UNESCO’s list of intangible cultural heritage.","ko":"늦가을에 가족·이웃이 함께 해요. 유네스코 인류무형문화유산."},"s":0}],"checks":[{"en":"김장은 … 말해요 in one breath, falling only at the end.","ko":"\"김장은 … 말해요\"를 한 호흡으로, 끝에서만 내렸다."},{"en":"많이 sounded like [마니] – no h.","ko":"\"많이\"를 [마니]로 읽었다."},{"en":"먹을 [머글], 번에 [버네] and 것을 [거슬] were linked.","ko":"[머글], [버네], [거슬]을 이어 읽었다."},{"en":"I can explain a word with “-는 것을 말해요”.","ko":"\"-는 것을 말해요\"로 단어를 설명할 수 있다."}]},{"id":"b","key":"B","title":{"en":"In the past","ko":"예전에는"},"segs":[3,7],"chunks":[[3],[4],[3,4],[5],[3,4,5],[6],[7],[6,7]],"tr":{"en":"In the past, people put the kimjang kimchi into earthenware jars and buried them in the ground to keep it. That way it ferments well and keeps for a long time.","ko":"In the past, people put the kimjang kimchi into earthenware jars and buried them in the ground to keep it. That way it ferments well and keeps for a long time."},"items":[["발음 변화",3,11,{"en":"ㄴ moves to 에 (연음) → [예저네는].","ko":"ㄴ이 넘어가요(연음) → [예저네는]."}],["강조",3,11,{"en":"Contrast: in the PAST (예전에는) … – later in the text: NOWADAYS (요즘은) …","ko":"대조: \"예전에는\" … (뒤에서 \"요즘은\" …)."}],["억양",3,"@t",{"en":"Time phrase with 는: no pause, keep going →.","ko":"때 + 는: 쉬지 않고 이어요 →."}],["강조",4,14,{"en":"New information: a large earthenware jar (항아리).","ko":"새 정보: \"항아리\"."}],["발음 변화",4,15,{"en":"넣은 → [너은]: the ㅎ at the end of 넣- is silent before a vowel (ㅎ 탈락).","ko":"받침 ㅎ은 모음 앞에서 소리 나지 않아요(ㅎ 탈락) → [너은]."}],["억양",4,"@t",{"en":"-(으)ㄴ 후 (“after …”): the voice rises on 후 and holds →.","ko":"\"-(으)ㄴ 후\": \"후\"에서 올려서 유지 →."}],["쉼",4,"@p",{"en":"Short pause (|) after 넣은 후 – the audio is silent for about 0.2 s, a bit longer than the closure of tense ㄸ in 땅.","ko":"\"넣은 후\" 뒤에서 짧게 쉬어요 (|). 음성에서 약 0.2초 무음."}],["소리",5,17,{"en":"땅 starts with tense ㄸ: tight, no puff of air. 탕 (aspirated) or 당 (lenis) would be different sounds.","ko":"\"땅\"은 된소리 ㄸ. 바람 없이 힘주어요. 탕·당과 달라요."}],["강조",5,17,{"en":"New information: in the ground (땅에).","ko":"새 정보: \"땅에\"."}],["발음 변화",5,18,{"en":"ㄷ moves to 어 (연음) → [무더].","ko":"ㄷ이 넘어가요(연음) → [무더]."}],["발음 변화",5,19,{"en":"ㅆ moves to 어 (연음) → [보관해써요]. Here the ㅎ in 했 is clearly audible – compare 말해요 in part A.","ko":"ㅆ이 넘어가요(연음) → [보관해써요]. 여기서는 \"했\"의 ㅎ이 또렷해요. A의 \"말해요\"와 비교해 보세요."}],["억양",5,"@t",{"en":"Statement: the voice falls ↘.","ko":"평서문: 내려요 ↘."}],["쉼",5,"@p",{"en":"Long pause (||) – about 0.6 s.","ko":"길게 쉬어요 (||). 약 0.6초."}],["소리",6,21,{"en":"발효: after ㄹ the ㅎ is only a light breath in the audio – close to [바료].","ko":"ㄹ 뒤의 ㅎ이 약해서 [바료]에 가깝게 들려요."}],["강조",6,21,{"en":"New information: fermentation (발효).","ko":"새 정보: \"발효\"."}],["억양",6,"@t",{"en":"-고 (“and”) links two results: the voice rises on 고 →.","ko":"\"-고\"로 두 결과를 이어요. \"고\"에서 올려요 →."}],["쉼",6,"@p",{"en":"Short pause (|) after 잘되고 – about 0.15 s.","ko":"\"잘되고\" 뒤에서 짧게 쉬어요 (|). 약 0.15초."}],["발음 변화",7,25,{"en":"After -(으)ㄹ (보관할), ㅅ becomes tense: [쑤] (경음화).","ko":"\"-(으)ㄹ\" 뒤의 ㅅ은 된소리 → [쑤](경음화)."}],["발음 변화",7,26,{"en":"ㅆ moves to 어 (연음) → [이써요].","ko":"ㅆ이 넘어가요(연음) → [이써요]."}],["억양",7,"@t",{"en":"Statement: the voice falls ↘.","ko":"평서문: 내려요 ↘."}]],"why":[[{"en":"예전에는 → 김장 김치를 항아리에 넣은 후 → | 땅에 묻어 보관했어요 ↘ ||","ko":"예전에는 → 김장 김치를 항아리에 넣은 후 → | 땅에 묻어 보관했어요 ↘ ||"},{"en":"Steps in order: put it in a jar → after that → bury it and store it. A short pause after 후 separates the two steps.","ko":"순서대로: 항아리에 넣은 후 → 땅에 묻어 보관. \"후\" 뒤의 짧은 쉼이 두 단계를 나눠요."}],[{"en":"그러면 → 발효도 잘되고 → | 오래 보관할 수 있어요 ↘","ko":"그러면 → 발효도 잘되고 → | 오래 보관할 수 있어요 ↘"},{"en":"그러면 (“that way”) introduces the result; two results are joined with -고.","ko":"\"그러면\"으로 결과를 말하고, 두 결과를 \"-고\"로 이어요."}],[{"en":"[너은] · [무더] · [쑤]","ko":"[너은] · [무더] · [쑤]"},{"en":"A silent ㅎ, linking, and a tense sound after -(으)ㄹ.","ko":"ㅎ 탈락, 연음, \"-(으)ㄹ\" 뒤 경음화."}]],"idi":[{"de":"항아리","tag":{"en":"Vocabulary","ko":"어휘"},"mean":{"en":"earthenware jar, crock","ko":"흙으로 구운 큰 그릇"},"note":{"en":"Traditional brown jars for kimchi, soy sauce and pastes (장). 장독대 = the place where the jars stand.","ko":"김치·장을 담는 그릇. 장독대."},"s":4},{"de":"V-(으)ㄴ 후","tag":{"en":"Grammar","ko":"문법"},"mean":{"en":"after doing …","ko":"어떤 일을 한 뒤에"},"note":{"en":"넣다 → 넣은 후 (after putting in). You met it in lesson 4: 공연을 본 후에.","ko":"4과의 \"공연을 본 후에\"와 같아요."},"s":4},{"de":"묻다 → 묻어 (보관하다)","tag":{"en":"Vocabulary","ko":"어휘"},"mean":{"en":"to bury → bury and (store)","ko":"땅속에 넣고 덮다"},"note":{"en":"-아/어 links two actions: 묻어 보관했어요 = buried it and kept it. Careful: 묻다 “to ask” is irregular (물어요), but 묻다 “to bury” is regular (묻어요).","ko":"\"묻어 보관했어요\": 묻고 보관했어요. 주의: 묻다(질문) → 물어요, 묻다(땅에) → 묻어요."},"s":5},{"de":"발효(가) 잘되다","tag":{"en":"Expression","ko":"표현"},"mean":{"en":"to ferment well","ko":"발효가 잘 일어나다"},"note":{"en":"발효 = fermentation; 잘되다 = to go well. 발효 식품 = fermented food (kimchi, 된장, 막걸리).","ko":"발효 식품: 김치, 된장, 막걸리."},"s":6},{"de":"그러면 · -(으)ㄹ 수 있다","tag":{"en":"Grammar","ko":"문법"},"mean":{"en":"that way / then · can","ko":"앞 내용의 결과 · 가능"},"note":{"en":"그러면 introduces a result. 보관하다 → 보관할 수 있어요 = it can be kept. 오래 = for a long time.","ko":"그러면 + 결과. 보관할 수 있어요. 오래."},"s":7}],"checks":[{"en":"Short pause after 넣은 후, then a tight ㄸ in 땅.","ko":"\"넣은 후\" 뒤에서 짧게 쉬고, \"땅\"을 된소리로 읽었다."},{"en":"넣은 [너은] without h; 묻어 [무더] linked.","ko":"[너은], [무더]를 정확히 읽었다."},{"en":"Short pause after 잘되고; 보관할 수 with a tense [쑤].","ko":"\"잘되고\" 뒤에서 짧게 쉬고, [보관할 쑤]로 읽었다."},{"en":"Both sentences fell at the end ↘.","ko":"두 문장 모두 끝을 내렸다 ↘."}]},{"id":"c","key":"C","title":{"en":"Nowadays – and a suggestion","ko":"요즘은 · 구경 갈까요?"},"segs":[8,12],"chunks":[[8],[9],[8,9],[10],[11],[12],[10,11,12]],"tr":{"en":"These days, people keep it in a kimchi refrigerator. Well, if we’re done eating, shall we go out and have a look around?","ko":"These days, people keep it in a kimchi refrigerator. Well, if we’re done eating, shall we go out and have a look around?"},"items":[["발음 변화",8,27,{"en":"ㅁ moves to 은 (연음) → [요즈믄].","ko":"ㅁ이 넘어가요(연음) → [요즈믄]."}],["강조",8,27,{"en":"Contrast with 예전에는: NOWADAYS.","ko":"\"예전에는\"과 대조: \"요즘은\"."}],["억양",8,"@t",{"en":"No pause after 요즘은 – keep going →.","ko":"\"요즘은\" 뒤에서 쉬지 않아요 →."}],["강조",9,28,{"en":"New information: a kimchi refrigerator (김치냉장고).","ko":"새 정보: \"김치냉장고\"."}],["발음 변화",9,29,{"en":"넣어 → [너어]: ㅎ is silent before a vowel (ㅎ 탈락).","ko":"받침 ㅎ이 소리 나지 않아요(ㅎ 탈락) → [너어]."}],["억양",9,"@t",{"en":"Statement: the voice falls ↘.","ko":"평서문: 내려요 ↘."}],["쉼",9,"@p",{"en":"Long pause (||) – about 0.7 s. The topic changes: now comes an invitation.","ko":"길게 쉬어요 (||). 약 0.7초. 이제 화제가 바뀌어요."}],["억양",10,"@t",{"en":"자 (“well, now”) gets the listener’s attention before a suggestion. Short, then a small pause.","ko":"\"자\"는 제안하기 전에 주의를 끄는 말. 짧게 말하고 잠깐 쉬어요."}],["쉼",10,"@p",{"en":"Short pause (|) after 자 – about 0.2 s.","ko":"\"자\" 뒤에서 짧게 쉬어요 (|). 약 0.2초."}],["발음 변화",11,33,{"en":"ㄱ and ㅆ move on (연음) → [머거쓰면].","ko":"ㄱ과 ㅆ이 넘어가요(연음) → [머거쓰면]."}],["억양",11,"@t",{"en":"-(으)면 and -아서 keep the sentence going: no pause, the voice stays up →.","ko":"\"-(으)면\", \"-아서\"로 이어져요. 쉬지 않고 높게 →."}],["강조",12,35,{"en":"New information: sightseeing (구경).","ko":"새 정보: \"구경\"."}],["억양",12,"@t",{"en":"Suggestion question -(으)ㄹ까요? (“Shall we …?”): the voice dips on 까 and rises on 요 ↗.","ko":"제안하는 질문 \"-(으)ㄹ까요?\": \"까\"에서 내려갔다가 \"요\"에서 올려요 ↗."}]],"why":[[{"en":"요즘은 → 김치냉장고에 넣어 보관해요 ↘ ||","ko":"요즘은 → 김치냉장고에 넣어 보관해요 ↘ ||"},{"en":"The answer to 예전에는: past vs. now. 넣어 보관해요 = put it in and keep it.","ko":"\"예전에는\"과 대조: 예전과 요즘."}],[{"en":"자, | 다 먹었으면 나가서 → 구경 좀 할까요 ↗","ko":"자, | 다 먹었으면 나가서 → 구경 좀 할까요 ↗"},{"en":"A new topic: 자 gets attention, then a polite suggestion that rises at the end.","ko":"새 화제: \"자\"로 주의를 끌고, 끝을 올리는 정중한 제안."}]],"idi":[{"de":"김치냉장고","tag":{"en":"Vocabulary","ko":"어휘"},"mean":{"en":"kimchi refrigerator","ko":"김치를 보관하는 냉장고"},"note":{"en":"A separate fridge that keeps kimchi at the right temperature – most Korean homes have one.","ko":"대부분의 한국 집에 있어요."},"s":9},{"de":"예전에는 ↔ 요즘은","tag":{"en":"Expression","ko":"표현"},"mean":{"en":"in the past ↔ nowadays","ko":"과거와 현재를 대조"},"note":{"en":"는 contrasts two times: 예전에는 … 보관했어요. 요즘은 … 보관해요. Note the tenses: past ↔ present.","ko":"시제도 대조: 보관했어요 ↔ 보관해요."},"s":8},{"de":"-았/었으면","tag":{"en":"Grammar","ko":"문법"},"mean":{"en":"if / once (you) have …","ko":"완료된 일을 조건으로"},"note":{"en":"다 먹었으면 = if (we’ve) finished eating. 다 = all, completely.","ko":"다 먹었으면 = 먹는 것이 끝났으면."},"s":11},{"de":"구경(을) 하다","tag":{"en":"Vocabulary","ko":"어휘"},"mean":{"en":"to look around, go sightseeing","ko":"이것저것 둘러보다"},"note":{"en":"구경 좀 할까요? – 좀 makes the suggestion softer and more polite.","ko":"\"좀\"을 넣으면 부드러워요."},"s":12},{"de":"-(으)ㄹ까요?","tag":{"en":"Grammar","ko":"문법"},"mean":{"en":"Shall we …? (suggestion)","ko":"같이 하자고 제안하는 질문"},"note":{"en":"나가서 구경 좀 할까요? = Shall we go out and look around? Answer: 네, 좋아요!","ko":"대답: 네, 좋아요!"},"s":12}],"checks":[{"en":"넣어 sounded like [너어] – no h.","ko":"\"넣어\"를 [너어]로 읽었다."},{"en":"A small pause after 자.","ko":"\"자\" 뒤에서 잠깐 쉬었다."},{"en":"먹었으면 [머거쓰면] and 나가서 without stopping.","ko":"[머거쓰면]과 \"나가서\"를 멈추지 않고 이었다."},{"en":"할까요 rose at the end ↗.","ko":"\"할까요\" 끝을 올렸다 ↗."}]}],"fullChecks":[{"en":"I paused only at the marks, not after every word.","ko":"표시된 곳에서만 쉬었다."},{"en":"The ㅎ-words had no h: [마니], [너은], [너어].","ko":"[마니], [너은], [너어]를 ㅎ 없이 읽었다."},{"en":"예전에는 and 요즘은 sounded like a contrast.","ko":"\"예전에는\"과 \"요즘은\"이 대조로 들렸다."},{"en":"My recording is about as long as the model (about 20 seconds).","ko":"내 녹음 길이가 원어민과 비슷했다 (약 20초)."}]};

  else { recMsg(key, t('converting'), true); try { const mp3 = await toMp3(raw); await saveRec(key, mp3, 'audio/mpeg', 'mp3'); recMsg(key, ''); } catch (e) { await saveRec(key, raw, raw.type || 'audio/webm', /ogg/.test(type) ? 'ogg' : 'webm'); recMsg(key, t('convFail'), true); } }
  fillMine(); };
 rec.start(); mrT = Date.now(); mrIv = setInterval(recUI, 250); recUI(); }

 if (a === 'item') { const m = location.hash.match(/^#([a-z])-1$/); if (!m) return; const p = P.find(x => x.id === m[1]); itemIx[p.id] = Math.max(0, Math.min(p.items.length - 1, (itemIx[p.id] || 0) + (+el.dataset.d))); document.getElementById('mk').innerHTML = marks(p); document.getElementById('txt').innerHTML = ann(p.segs[0], p.segs[1], p.items[itemIx[p.id]]); nowI = -2; paint(); return; }
 if (a === 'theme') { const n = ROOT.dataset.look === 'night'; if (n) delete ROOT.dataset.look; else ROOT.dataset.look = 'night'; LS.set('kwt:look', n ? 'day' : 'night'); return; }
 if (a === 'size') { zi = (zi + 1) % ZL.length; LS.set('kwt:zi', zi); ROOT.style.setProperty('--z', ZL[zi][0]); for (const b of app.querySelectorAll('.az i')) b.textContent = ZL[zi][1]; toast(t('size', {s: tl('sizes', zi)})); return; }

 if (a === 'me') { const m = el.closest('.mine').querySelector('audio'); stop(); m.currentTime = 0; m.play().catch(() => {}); return; }
 if (a === 'cmp') { if (job && job.owner === own) { stop(); return; } const m = el.closest('.mine').querySelector('audio'); m.muted = true; const q = m.play(); if (q && q.then) q.then(() => { m.pause(); m.currentTime = 0; m.muted = false; }).catch(() => { m.muted = false; }); else { m.pause(); m.muted = false; }
  play({st: +el.dataset.st, en: +el.dataset.en, rate: 1, owner: own, follow: el.closest('.mine').dataset.key === 'full', onEnd: () => { m.muted = false; m.currentTime = 0; const r = m.play(); if (r && r.catch) r.catch(() => {}); }}); return; }
 if (a === 'save') { doSave(el.dataset.key); return; }

 if (a === 'done') { const id = el.dataset.to, g = pr(id); g.done = true; g.step = 1; saveProg(); const i = P.findIndex(x => x.id === id), nx = P.slice(i + 1).concat(P.slice(0, i)).find(x => !(prog[x.id] && prog[x.id].done)); toastMsg = t('partDone', {k: P[i].key}) + ' ' + (nx ? t('nextIs', {k: nx.key}) : t('allDone')); location.hash = 'home'; return; }
});
